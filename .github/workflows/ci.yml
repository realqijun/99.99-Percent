name: CI

# PRs only. main is protected: every change arrives through a PR whose
# `frontend` and `backend` checks passed against an up-to-date main, so
# re-running them after the merge would test the same code twice.
on:
  pull_request:

# A new push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No `paths:` filters on purpose: a filtered workflow never reports its
# required checks, and a required check that stays pending blocks the merge.
# Instead the `changes` job detects the touched areas and the real suites
# skip themselves; the required `frontend`/`backend` gate jobs still always
# run and report a result, so branch protection sees a decision either way.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.areas.outputs.frontend }}
      backend: ${{ steps.areas.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the base commit for the diff
        run: git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
      - name: Decide which areas this PR touches
        id: areas
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          echo "$files"
          hits() { grep -q -e "$1" -e "$2" -e "$3" -e "$4" <<< "$files" && echo true || echo false; }
          {
            echo "frontend=$(hits '^frontend/' '^shared/' '^\.github/workflows/ci\.yml$' '^\.nvmrc$')"
            echo "backend=$(hits '^backend/' '^shared/' '^\.github/workflows/ci\.yml$' '^\.nvmrc$')"
          } >> "$GITHUB_OUTPUT"

  frontend-checks:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run package:itch
      - run: npx playwright install --only-shell chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-results
          path: |
            frontend/coverage/
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Keep the existing branch-protection check.
  # always() makes a failed/skipped dependency fail this gate instead of skipping it —
  # except when the area was never touched, where a skipped suite is the intent.
  frontend:
    needs: [changes, frontend-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require frontend checks
        env:
          FRONTEND_TOUCHED: ${{ needs.changes.outputs.frontend }}
          CHECKS_RESULT: ${{ needs.frontend-checks.result }}
        run: |
          if [ "$FRONTEND_TOUCHED" != "true" ]; then
            echo "No frontend files changed; frontend suite skipped by design."
            exit 0
          fi
          if [ "$CHECKS_RESULT" != "success" ]; then
            echo "::error::Frontend checks: $CHECKS_RESULT"
            exit 1
          fi

  # The real backend suite. The required `backend` check below gates it, the
  # same way `frontend` gates the frontend jobs.
  backend-checks:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Also applies every migration to an in-memory Postgres (test/db.test.ts).
      - run: npm run test:coverage
      - name: Check migrations match the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::src/db/schema.ts changed without a migration. Run 'npm run db:generate' in backend/ and commit the files in backend/drizzle/."
            git status --porcelain -- drizzle
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  backend:
    needs: [changes, backend-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require static checks, coverage and migration consistency
        env:
          BACKEND_TOUCHED: ${{ needs.changes.outputs.backend }}
          CHECKS_RESULT: ${{ needs.backend-checks.result }}
        run: |
          if [ "$BACKEND_TOUCHED" != "true" ]; then
            echo "No backend files changed; backend suite skipped by design."
            exit 0
          fi
          if [ "$CHECKS_RESULT" != "success" ]; then
            echo "::error::Backend checks: $CHECKS_RESULT"
            exit 1
          fi
